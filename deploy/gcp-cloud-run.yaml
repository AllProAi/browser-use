# Google Cloud Run deployment configuration
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: research-intelligence
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: private
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        # Resource allocation
        run.googleapis.com/cpu: "2"
        run.googleapis.com/memory: "4Gi"
        run.googleapis.com/max-scale: "1"
        run.googleapis.com/min-scale: "1"
        
        # Timeout settings
        run.googleapis.com/timeout: "3600s"
        
        # Storage
        run.googleapis.com/cloudsql-instances: "YOUR_PROJECT_ID:YOUR_REGION:YOUR_INSTANCE_NAME"
        run.googleapis.com/volume-mounts: |
          [
            {
              "name": "research-results",
              "mountPath": "/app/research_results"
            },
            {
              "name": "logs", 
              "mountPath": "/app/logs"
            }
          ]
        run.googleapis.com/volumes: |
          [
            {
              "name": "research-results",
              "nfs": {
                "server": "YOUR_FILESTORE_IP",
                "path": "/research_results"
              }
            },
            {
              "name": "logs",
              "nfs": {
                "server": "YOUR_FILESTORE_IP", 
                "path": "/logs"
              }
            }
          ]
    spec:
      containerConcurrency: 1
      serviceAccountName: research-intelligence-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
      - name: research-intelligence
        image: gcr.io/YOUR_PROJECT_ID/research-intelligence:latest
        ports:
        - containerPort: 8080
        
        # Environment variables
        env:
        - name: DAILY_ANALYSIS_TIME
          value: "09:00"
        - name: TIMEZONE
          value: "America/New_York"
        - name: RUN_MODE
          value: "scheduler"
        - name: HEADLESS_MODE
          value: "true"
        - name: ENABLE_EMAIL_REPORTS
          value: "true"
        - name: ENABLE_ARCHIVING
          value: "true"
        - name: HEALTH_CHECK_PORT
          value: "8080"
        
        # Secrets from Secret Manager
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: latest
        - name: EMAIL_SENDER
          valueFrom:
            secretKeyRef:
              name: email-sender
              key: latest
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-password
              key: latest
        - name: EMAIL_RECIPIENTS
          valueFrom:
            secretKeyRef:
              name: email-recipients
              key: latest
        
        # Resource limits
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "1000m"
            memory: "2Gi"
        
        # Startup probe
        startupProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
# Cloud Scheduler job for triggering (alternative to continuous running)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-intelligence-cron
spec:
  schedule: "0 9 * * *"  # Daily at 9:00 AM
  timeZone: "America/New_York"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: research-intelligence
            image: gcr.io/YOUR_PROJECT_ID/research-intelligence:latest
            env:
            - name: RUN_MODE
              value: "once"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: latest
            # ... other environment variables and secrets
            resources:
              limits:
                cpu: "2000m"
                memory: "4Gi"
              requests:
                cpu: "1000m"
                memory: "2Gi"
